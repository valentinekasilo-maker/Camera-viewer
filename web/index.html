<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/branding/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ANDRO-Vision — Local AI Vision & Smart Camera System</title>
    <meta name="description" content="ANDRO-Vision — Local AI Vision & Smart Camera System" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/branding/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/branding/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/branding/favicon-16x16.png"
    />
    <link rel="icon" type="image/svg+xml" href="/images/branding/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/images/branding/favicon.svg" color="#3b82f6" />
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the PWA service worker for install-prompt support.
      // Skipped when Vite HMR is active (import.meta.hot) to avoid dev conflicts.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js", { scope: "/" })
            .then(function (reg) {
              console.debug("[SW] Registered:", reg.scope);
            })
            .catch(function (err) {
              console.warn("[SW] Registration failed:", err);
            });
        });
      }
    </script>
  </body>
</html>
